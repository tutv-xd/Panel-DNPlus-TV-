<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal 5 DNPlus TV • Panel de Emisión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- HLS.js para reproducción .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- MQTT.js para sincronización en tiempo real con espectadores -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.35);
            border-radius: 9999px;
        }
        #monitorContainer.tv-expanded-fs {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
            background-color: #000000 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#030712] text-slate-100 overflow-x-hidden selection:bg-sky-500 selection:text-white">

    <!-- Cabecera del Panel -->
    <header class="sticky top-0 z-30 bg-[#07122b]/95 backdrop-blur-md border-b border-blue-900/70">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-white/10 border border-white/15 p-1 flex items-center justify-center shrink-0">
                    <img
                        src="https://i.postimg.cc/LXRZWmVc/Picsart-26-11-16-18-48-31-391.jpg"
                        alt="Logo Canal 5 DNPlus TV"
                        onerror="this.onerror=null;this.src='https://placehold.co/80x80/0f172a/38bdf8?text=DN5';"
                        class="w-full h-full object-contain rounded-lg"
                    >
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-base font-black text-white truncate">
                        Panel Emisor • <span class="text-sky-400">Canal 5 DNPlus TV</span>
                    </h1>
                    <p id="mqttPanelStatus" class="text-[11px] text-amber-300 font-semibold truncate">
                        Conectando con espectadores...
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="viewerCountBadge" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>En Línea</span>
                </span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal del Panel -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- Columna Izquierda: Monitor de Vista Previa -->
        <section class="lg:col-span-6 flex flex-col gap-3">
            <div id="monitorContainer" class="relative w-full aspect-video bg-black rounded-3xl overflow-hidden border border-sky-500/40 shadow-2xl flex items-center justify-center">
                <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 bg-slate-950/85 px-2.5 py-1 rounded-xl border border-white/10 pointer-events-none">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    <span class="text-[10px] font-black text-white uppercase">MONITOR EMISOR</span>
                </div>

                <div id="panelNotice" class="hidden absolute top-3 right-3 z-20 bg-slate-950/90 border border-sky-500/40 text-sky-200 px-2.5 py-1 rounded-xl text-[10px] font-bold">
                    <span id="panelNoticeText">Listo</span>
                </div>

                <video
                    id="previewVideo"
                    class="w-full h-full object-contain bg-black"
                    autoplay
                    playsinline
                    controls
                ></video>

                <button
                    type="button"
                    onclick="togglePanelFullscreen()"
                    class="absolute bottom-3 right-3 z-20 h-9 px-2.5 rounded-xl bg-slate-950/85 hover:bg-sky-600 text-white border border-white/15 text-[11px] font-black flex items-center gap-1 cursor-pointer transition"
                >
                    <i id="panelFsIcon" class="fa-solid fa-expand"></i>
                    <span>TV</span>
                </button>
            </div>

            <!-- Barra de Canal en Vista Previa -->
            <div class="bg-[#0a1329] border border-blue-900/70 rounded-2xl p-3 flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] font-black text-sky-400 uppercase">Vista Previa del Panel</p>
                    <p id="previewTitle" class="text-xs sm:text-sm font-black text-white truncate">Sin canal seleccionado</p>
                </div>
                <button
                    type="button"
                    onclick="emitMqttState(true)"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shrink-0 cursor-pointer transition"
                >
                    <i class="fa-solid fa-tower-broadcast"></i>
                    <span>Enviar a Espectadores</span>
                </button>
            </div>

            <!-- Lista de Canales Guardados en el Panel (Con botón Borrar individual y Borrar Todos) -->
            <div class="bg-[#0a1329] border border-blue-900/70 rounded-3xl p-3.5 flex flex-col gap-2.5 shadow-xl">
                <div class="flex items-center justify-between gap-2">
                    <h2 class="text-xs font-black text-sky-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-list-check"></i> Canales Guardados (<span id="savedCountText">0</span>)
                    </h2>
                    <button
                        type="button"
                        onclick="clearAllSavedChannels()"
                        class="px-2.5 py-1 rounded-xl bg-red-600/20 hover:bg-red-600 border border-red-500/40 text-red-300 hover:text-white text-[11px] font-extrabold flex items-center gap-1 cursor-pointer transition"
                    >
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Borrar Todos</span>
                    </button>
                </div>

                <div id="savedChannelsList" class="flex flex-col gap-1.5 max-h-72 overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </section>

        <!-- Columna Derecha: Agregar Uno a Uno y Extractor M3U (Exclusivo del Panel) -->
        <section class="lg:col-span-6 flex flex-col gap-3">

            <!-- Formulario Agregar Canal Uno a Uno -->
            <form onsubmit="addSingleChannel(event)" class="bg-[#0a1329] border border-blue-900/70 rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
                <h2 class="text-xs font-black text-sky-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-plus-circle"></i> Agregar Canal Uno a Uno
                </h2>

                <!-- Selector de Categoría: Solo TV en Vivo o Películas y Series -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setFormCategory('tv')" id="catBtn-tv" class="py-2 px-3 rounded-xl bg-sky-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition">
                        <i class="fa-solid fa-tv"></i>
                        <span>TV en Vivo</span>
                    </button>
                    <button type="button" onclick="setFormCategory('peliculas')" id="catBtn-peliculas" class="py-2 px-3 rounded-xl bg-slate-900 text-slate-300 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition">
                        <i class="fa-solid fa-film"></i>
                        <span>Películas y Series</span>
                    </button>
                </div>

                <input
                    id="inputChannelTitle"
                    type="text"
                    required
                    placeholder="Nombre del canal o película (ej: Canal 5 HD)"
                    class="w-full bg-slate-950 border border-slate-800 focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 outline-none"
                >

                <input
                    id="inputChannelUrl"
                    type="url"
                    required
                    placeholder="Enlace del video (.m3u8 o .mp4)"
                    class="w-full bg-slate-950 border border-slate-800 focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 outline-none"
                >

                <button
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer transition shadow-lg"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span>Agregar y Sincronizar con Espectadores</span>
                </button>
            </form>

            <!-- Extractor / Selector de Lista M3U (Solo en el Panel Emisor) -->
            <div class="bg-[#0a1329] border border-blue-900/70 rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
                <div class="flex items-center justify-between gap-2">
                    <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Extraer Canales de Lista M3U
                    </h2>
                    <label class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-300 text-[11px] font-bold cursor-pointer flex items-center gap-1 transition">
                        <i class="fa-solid fa-file-arrow-up"></i>
                        <span>Subir .M3U</span>
                        <input type="file" accept=".m3u,.m3u8,.txt" onchange="handleM3uFileUpload(event)" class="hidden">
                    </label>
                </div>

                <textarea
                    id="iptvRawInput"
                    rows="3"
                    placeholder="Pega aquí tu enlace https://.../lista.m3u o el texto #EXTM3U..."
                    class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl p-3 text-xs text-white placeholder-slate-500 outline-none resize-none"
                ></textarea>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button
                        type="button"
                        onclick="extractM3uChannels()"
                        class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer transition"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Extraer y Elegir Uno a Uno</span>
                    </button>
                    <button
                        type="button"
                        onclick="importAllIptvChannels()"
                        class="bg-sky-600 hover:bg-sky-500 text-white font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer transition"
                    >
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Sumar Toda la Lista</span>
                    </button>
                </div>

                <!-- Resultados Extraídos con Buscador -->
                <div id="m3uExtractorBox" class="hidden flex flex-col gap-2 pt-2 border-t border-slate-800">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[11px] font-bold text-slate-300">
                            Encontrados: <strong id="extractedTotalCount" class="text-amber-400">0</strong>
                        </span>
                        <button type="button" onclick="closeExtractorBox()" class="text-[11px] text-slate-400 hover:text-white cursor-pointer">
                            Cerrar
                        </button>
                    </div>
                    <input
                        id="m3uSearchInput"
                        type="text"
                        oninput="renderExtractedM3uList()"
                        placeholder="Buscar canal por nombre..."
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 outline-none"
                    >
                    <div id="extractedM3uList" class="flex flex-col gap-1.5 max-h-60 overflow-y-auto pr-1 custom-scroll"></div>
                </div>
            </div>

        </section>
    </main>

    <!-- Pie de Página -->
    <footer class="bg-[#07122b] border-t border-blue-950 py-3 text-center text-xs text-slate-400">
        &copy; 2026 Canal 5 DNPlus TV • Panel de Emisión
    </footer>

    <script>
        const PANEL_STORAGE_KEY = 'dnplus_panel_channels_v2';
        const MQTT_BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt',
            'wss://test.mosquitto.org:8081/mqtt'
        ];
        const MQTT_TOPICS = [
            'dnplus/canal5/live',
            'dnplus/canal5/playlist',
            'dnplus/canal5/DNPLUS-CANAL5-OFICIAL',
            'canal5-dnplus-senal-vivo'
        ];

        let channels = [];
        let selectedCategory = 'tv';
        let activePreviewIndex = 0;
        let extractedItems = [];
        let previewHls = null;
        let isPanelFs = false;
        const mqttClients = [];
        const previewVideo = document.getElementById('previewVideo');
        const monitorContainer = document.getElementById('monitorContainer');

        function showPanelNotice(msg, ms = 2000) {
            const box = document.getElementById('panelNotice');
            const txt = document.getElementById('panelNoticeText');
            if (!box || !txt) return;
            txt.textContent = msg;
            box.classList.remove('hidden');
            clearTimeout(window._panelNoticeTimer);
            window._panelNoticeTimer = setTimeout(() => {
                box.classList.add('hidden');
            }, ms);
        }

        function saveChannels() {
            try {
                localStorage.setItem(PANEL_STORAGE_KEY, JSON.stringify(channels.slice(0, 150)));
            } catch (e) {}
        }

        function loadChannels() {
            try {
                const raw = localStorage.getItem(PANEL_STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    channels = parsed
                        .filter((c) => c && c.url)
                        .map((c) => ({
                            title: String(c.title || 'Canal 5'),
                            url: String(c.url).trim(),
                            category: c.category === 'peliculas' ? 'peliculas' : 'tv'
                        }));
                }
            } catch (e) {}
        }

        function setFormCategory(cat) {
            selectedCategory = cat === 'peliculas' ? 'peliculas' : 'tv';
            ['tv', 'peliculas'].forEach((name) => {
                const btn = document.getElementById(`catBtn-${name}`);
                if (!btn) return;
                btn.className = name === selectedCategory
                    ? (name === 'peliculas'
                        ? 'py-2 px-3 rounded-xl bg-violet-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition'
                        : 'py-2 px-3 rounded-xl bg-sky-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition')
                    : 'py-2 px-3 rounded-xl bg-slate-900 text-slate-300 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition';
            });
        }

        function togglePanelFullscreen() {
            isPanelFs = !isPanelFs;
            if (monitorContainer) {
                monitorContainer.classList.toggle('tv-expanded-fs', isPanelFs);
            }
            const icon = document.getElementById('panelFsIcon');
            if (icon) {
                icon.className = isPanelFs ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
            }
        }

        function playPreviewAt(idx) {
            if (!channels.length) return;
            activePreviewIndex = ((idx % channels.length) + channels.length) % channels.length;
            const item = channels[activePreviewIndex];

            const titleEl = document.getElementById('previewTitle');
            if (titleEl) titleEl.textContent = item.title;

            if (previewHls) {
                previewHls.destroy();
                previewHls = null;
            }

            if (previewVideo) {
                const isHlsUrl = /\.m3u8(\?|$)/i.test(item.url) || !/\.(mp4|webm|ogg|m4v)(\?|$)/i.test(item.url);
                if (isHlsUrl && typeof Hls !== 'undefined' && Hls.isSupported()) {
                    previewHls = new Hls({
                        enableWorker: true,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60
                    });
                    previewHls.loadSource(item.url);
                    previewHls.attachMedia(previewVideo);
                    previewHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        previewVideo.play().catch(() => {});
                    });
                } else {
                    previewVideo.src = item.url;
                    previewVideo.load();
                    previewVideo.play().catch(() => {});
                }
            }

            renderChannelList();
        }

        function renderChannelList() {
            const listEl = document.getElementById('savedChannelsList');
            const countEl = document.getElementById('savedCountText');
            if (countEl) countEl.textContent = String(channels.length);
            if (!listEl) return;

            listEl.innerHTML = '';
            if (!channels.length) {
                listEl.innerHTML = `
                    <div class="py-6 px-3 rounded-2xl border border-dashed border-slate-800 text-center text-xs text-slate-400">
                        No hay canales agregados todavía. Agrega uno arriba o extrae desde una lista M3U.
                    </div>
                `;
                return;
            }

            const frag = document.createDocumentFragment();
            channels.forEach((ch, idx) => {
                const isCurrent = idx === activePreviewIndex;
                const isMovie = ch.category === 'peliculas';
                const row = document.createElement('div');
                row.className = `p-2.5 rounded-xl border flex items-center justify-between gap-2 ${
                    isCurrent
                        ? 'bg-sky-600/20 border-sky-400 text-white'
                        : 'bg-slate-950/90 border-slate-800 text-slate-200'
                }`;
                row.innerHTML = `
                    <button type="button" onclick="playPreviewAt(${idx})" class="flex items-center gap-2 min-w-0 flex-1 text-left cursor-pointer">
                        <span class="w-7 h-7 rounded-lg ${isMovie ? 'bg-violet-600' : 'bg-sky-600'} text-white flex items-center justify-center shrink-0">
                            <i class="fa-solid ${isMovie ? 'fa-film' : 'fa-tv'} text-[11px]"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-extrabold truncate">${ch.title}</p>
                            <p class="text-[10px] text-slate-400 truncate">${isMovie ? 'Películas y Series' : 'TV en Vivo'}</p>
                        </div>
                    </button>
                    <button type="button" onclick="deleteSavedChannel(${idx})" title="Borrar este canal" class="px-2.5 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white text-[11px] font-bold shrink-0 cursor-pointer transition">
                        Borrar
                    </button>
                `;
                frag.appendChild(row);
            });
            listEl.appendChild(frag);
        }

        function addSingleChannel(ev) {
            ev.preventDefault();
            const titleInput = document.getElementById('inputChannelTitle');
            const urlInput = document.getElementById('inputChannelUrl');
            const title = (titleInput?.value || '').trim();
            const url = (urlInput?.value || '').trim();
            if (!title || !url) return;

            const existingIdx = channels.findIndex((c) => c.url === url);
            if (existingIdx >= 0) {
                channels[existingIdx].title = title;
                channels[existingIdx].category = selectedCategory;
                activePreviewIndex = existingIdx;
            } else {
                channels.push({ title, url, category: selectedCategory });
                activePreviewIndex = channels.length - 1;
            }

            saveChannels();
            if (titleInput) titleInput.value = '';
            if (urlInput) urlInput.value = '';
            playPreviewAt(activePreviewIndex);
            emitMqttState(true);
            showPanelNotice(`Agregado y enviado: ${title}`);
        }

        function deleteSavedChannel(idx) {
            if (idx < 0 || idx >= channels.length) return;
            channels.splice(idx, 1);
            if (activePreviewIndex >= channels.length) {
                activePreviewIndex = Math.max(0, channels.length - 1);
            }
            saveChannels();
            renderChannelList();
            if (channels.length === 0) {
                clearAllSavedChannels();
            } else {
                emitMqttState(true);
                showPanelNotice('Canal borrado y lista actualizada');
            }
        }

        function clearAllSavedChannels() {
            channels = [];
            activePreviewIndex = 0;
            saveChannels();
            if (previewHls) {
                previewHls.destroy();
                previewHls = null;
            }
            if (previewVideo) {
                previewVideo.pause();
                previewVideo.removeAttribute('src');
                previewVideo.load();
            }
            const titleEl = document.getElementById('previewTitle');
            if (titleEl) titleEl.textContent = 'Sin canal seleccionado';
            renderChannelList();

            const clearPayload = JSON.stringify({
                mode: 'playlist',
                clearAll: true,
                title: 'Lista vacía',
                url: '',
                playlist: [],
                timestamp: Date.now()
            });

            try {
                localStorage.setItem('dnplus_live_signal', clearPayload);
                localStorage.setItem('dnplus_live_playlist', '[]');
            } catch (e) {}

            mqttClients.forEach((client) => {
                if (client && client.connected) {
                    MQTT_TOPICS.forEach((t) => {
                        try { client.publish(t, clearPayload, { qos: 1, retain: true }); } catch (e) {}
                    });
                }
            });
            showPanelNotice('Todos los canales fueron borrados');
        }

        function parseM3uLines(raw) {
            const lines = String(raw || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
            const items = [];
            let pendingTitle = '';
            for (const line of lines) {
                if (line.startsWith('#EXTINF')) {
                    const commaIdx = line.lastIndexOf(',');
                    pendingTitle = commaIdx >= 0 ? line.slice(commaIdx + 1).trim() : '';
                } else if (!line.startsWith('#') && /^https?:\/\//i.test(line)) {
                    items.push({
                        title: pendingTitle || `Canal ${items.length + 1}`,
                        url: line
                    });
                    pendingTitle = '';
                }
            }
            return items;
        }

        async function resolveM3uContent(raw) {
            let parsed = [];
            if (/^https?:\/\/\S+$/i.test(raw)) {
                try {
                    const res = await fetch(raw);
                    if (res.ok) parsed = parseM3uLines(await res.text());
                } catch (e) {}
                if (!parsed.length) {
                    try {
                        const proxyRes = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(raw));
                        if (proxyRes.ok) parsed = parseM3uLines(await proxyRes.text());
                    } catch (e) {}
                }
                if (!parsed.length && /\.(m3u8|mp4)(\?|$)/i.test(raw)) {
                    parsed = [{ title: 'Señal Directa', url: raw }];
                }
            } else {
                parsed = parseM3uLines(raw);
            }
            return parsed;
        }

        function handleM3uFileUpload(ev) {
            const file = ev.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const area = document.getElementById('iptvRawInput');
                if (area) area.value = String(reader.result || '');
                extractM3uChannels();
            };
            reader.readAsText(file);
        }

        async function extractM3uChannels() {
            const raw = (document.getElementById('iptvRawInput')?.value || '').trim();
            if (!raw) {
                showPanelNotice('Pega un enlace .m3u o sube un archivo primero');
                return;
            }
            showPanelNotice('Extrayendo canales de la lista M3U...');
            const parsed = await resolveM3uContent(raw);
            if (!parsed.length) {
                showPanelNotice('No se pudo leer el enlace (descarga el .m3u y súbelo)');
                return;
            }
            extractedItems = parsed;
            const searchEl = document.getElementById('m3uSearchInput');
            if (searchEl) searchEl.value = '';
            document.getElementById('m3uExtractorBox')?.classList.remove('hidden');
            renderExtractedM3uList();
            showPanelNotice(`${parsed.length} canales extraídos`);
        }

        function closeExtractorBox() {
            document.getElementById('m3uExtractorBox')?.classList.add('hidden');
        }

        function renderExtractedM3uList() {
            const listEl = document.getElementById('extractedM3uList');
            const countEl = document.getElementById('extractedTotalCount');
            const query = (document.getElementById('m3uSearchInput')?.value || '').trim().toLowerCase();
            if (countEl) countEl.textContent = String(extractedItems.length);
            if (!listEl) return;

            const existingUrls = new Set(channels.map((c) => c.url));
            const filtered = extractedItems
                .map((item, idx) => ({ item, idx }))
                .filter(({ item }) => !query || item.title.toLowerCase().includes(query));

            listEl.innerHTML = '';
            const frag = document.createDocumentFragment();
            filtered.slice(0, 250).forEach(({ item, idx }) => {
                const isAdded = existingUrls.has(item.url);
                const row = document.createElement('div');
                row.className = 'p-2 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2';
                row.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <p class="text-[11px] font-extrabold text-white truncate">${item.title}</p>
                        <p class="text-[9px] font-mono text-slate-400 truncate">${item.url}</p>
                    </div>
                    <button type="button" onclick="pickExtractedChannel(${idx})" class="px-2.5 py-1.5 rounded-lg ${isAdded ? 'bg-emerald-700/40 text-emerald-200 border border-emerald-500/40' : 'bg-sky-600 hover:bg-sky-500 text-white'} text-[10px] font-black shrink-0 cursor-pointer transition">
                        ${isAdded ? 'Agregado ✓' : '+ Agregar'}
                    </button>
                `;
                frag.appendChild(row);
            });
            listEl.appendChild(frag);
        }

        function pickExtractedChannel(idx) {
            const item = extractedItems[idx];
            if (!item) return;
            const existingIdx = channels.findIndex((c) => c.url === item.url);
            if (existingIdx >= 0) {
                channels[existingIdx].title = item.title;
                channels[existingIdx].category = selectedCategory;
                activePreviewIndex = existingIdx;
            } else {
                channels.push({ title: item.title, url: item.url, category: selectedCategory });
                activePreviewIndex = channels.length - 1;
            }
            saveChannels();
            renderExtractedM3uList();
            playPreviewAt(activePreviewIndex);
            emitMqttState(true);
            showPanelNotice(`Agregado: ${item.title}`);
        }

        async function importAllIptvChannels() {
            const raw = (document.getElementById('iptvRawInput')?.value || '').trim();
            if (!raw) return;
            const parsed = await resolveM3uContent(raw);
            if (!parsed.length) {
                showPanelNotice('No se encontraron enlaces válidos');
                return;
            }
            const existingUrls = new Set(channels.map((c) => c.url));
            const added = parsed
                .filter((c) => !existingUrls.has(c.url))
                .map((c) => ({ title: c.title, url: c.url, category: selectedCategory }));
            channels = channels.concat(added).slice(0, 150);
            saveChannels();
            renderChannelList();
            if (channels.length > 0) playPreviewAt(0);
            emitMqttState(true);
            showPanelNotice(`Se sumaron ${added.length} canales`);
        }

        function emitMqttState(notifyUser = false) {
            if (!channels.length) return;
            const current = channels[activePreviewIndex] || channels[0];
            const payloadObj = {
                mode: 'playlist',
                clearAll: false,
                title: current.title,
                url: current.url,
                streamUrl: current.url,
                category: current.category,
                playlist: channels.slice(0, 150),
                timestamp: Date.now()
            };
            const payloadStr = JSON.stringify(payloadObj);

            try {
                localStorage.setItem('dnplus_live_signal', payloadStr);
                localStorage.setItem('dnplus_live_playlist', JSON.stringify(channels.slice(0, 150)));
            } catch (e) {}

            mqttClients.forEach((client) => {
                if (client && client.connected) {
                    MQTT_TOPICS.forEach((topic) => {
                        try { client.publish(topic, payloadStr, { qos: 1, retain: true }); } catch (e) {}
                    });
                }
            });

            if (notifyUser) {
                showPanelNotice('Señal y lista enviadas a espectadores');
            }
        }

        function connectMqtt() {
            const statusEl = document.getElementById('mqttPanelStatus');
            if (typeof mqtt === 'undefined') return;
            MQTT_BROKERS.forEach((brokerUrl, i) => {
                try {
                    const client = mqtt.connect(brokerUrl, {
                        clientId: `dnplus_panel_${i}_` + Math.random().toString(16).slice(2, 8),
                        reconnectPeriod: 3500
                    });
                    mqttClients.push(client);
                    client.on('connect', () => {
                        if (statusEl) {
                            statusEl.textContent = 'Conectado • Sincronizando 24/7 con espectadores';
                            statusEl.className = 'text-[11px] text-emerald-400 font-semibold truncate';
                        }
                        if (channels.length > 0) {
                            emitMqttState(false);
                        }
                    });
                } catch (e) {}
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadChannels();
            renderChannelList();
            if (channels.length > 0) {
                playPreviewAt(0);
            }
            connectMqtt();
            // Latido continuo cada 8 segundos para que cualquier espectador nuevo o reconectado reciba la lista siempre
            setInterval(() => {
                if (channels.length > 0) {
                    emitMqttState(false);
                }
            }, 8000);
        });
    </script>
</body>
</html>
